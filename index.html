<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Popular Digital - Tu Banca en Línea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-popular { background-color: #002D62; }
        .text-popular { color: #002D62; }
        .border-popular { border-color: #002D62; }
        .bg-popular-light { background-color: #E6EEF8; }
        .bg-popular-gold { background-color: #D4AF37; }
        .text-popular-gold { color: #D4AF37; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased flex flex-col">

    <div id="app" class="flex-1 flex flex-col min-h-screen">
        <!-- Dynamic content will be injected here via JavaScript -->
    </div>

    <!-- Message Modal Box (Custom alert/confirm replacement) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all">
            <div class="flex items-center space-x-3 mb-4">
                <div id="modal-icon-container" class="w-12 h-12 rounded-full flex items-center justify-center bg-blue-100 text-popular text-xl">
                    <i id="modal-icon" class="fas fa-info-circle"></i>
                </div>
                <div>
                    <h3 id="modal-title" class="text-lg font-bold text-slate-900">Aviso</h3>
                    <p class="text-xs text-slate-500">Banco Popular Digital</p>
                </div>
            </div>
            <p id="modal-message" class="text-slate-600 text-sm mb-6 leading-relaxed">Mensaje del sistema...</p>
            <div id="modal-actions" class="flex justify-end space-x-3">
                <button id="modal-btn-ok" onclick="closeModal()" class="px-5 py-2.5 bg-popular text-white text-sm font-semibold rounded-xl hover:bg-blue-900 transition shadow-md">Entendido</button>
            </div>
        </div>
    </div>

    <script>
        // Global State Management with LocalStorage Persistence
        const STORAGE_KEY = 'banco_popular_digital_db_v1';
        
        let db = {
            isLoggedIn: false,
            user: null, // { name, bankName, accountNumber, balance, pin, phone, address, occupation, income, livingWith }
            transactions: [], // { id, type, description, amount, date, category }
            cards: {
                main: { number: '4532 •••• •••• 8892', expiry: '08/28', cvv: '392', status: 'Activa' },
                virtual: [] // max 2
            },
            loans: [], // { id, amount, term, monthly, reason, status: 'pendiente'|'aprobado', date }
            chatMessages: [
                { sender: 'bot', text: '¡Hola! Soy tu Asistente Virtual Popular. ¿En qué puedo ayudarte hoy sobre tus cuentas, tarjetas o préstamos?' }
            ],
            notifications: []
        };

        function saveDB() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }

        function loadDB() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    db = JSON.parse(data);
                } catch(e) {
                    console.error("Error loading session", e);
                }
            }
        }

        // Custom Modal helper
        function showModal(title, message, callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            const modal = document.getElementById('custom-modal');
            modal.classList.remove('hidden');
            window.modalCallback = callback;
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            if (window.modalCallback) {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!db.isLoggedIn) {
                app.innerHTML = renderAuthScreen();
            } else {
                app.innerHTML = renderDashboard();
            }
        }

        // AUTH & REGISTRATION SCREENS
        let authMode = 'login'; // 'login' or 'register'

        function renderAuthScreen() {
            return `
                <div class="flex-1 flex flex-col justify-center items-center p-6 bg-gradient-to-br from-slate-900 via-blue-950 to-popular">
                    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-white/20">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-popular text-white rounded-2xl text-2xl font-bold shadow-lg mb-3">
                                <i class="fas fa-university"></i>
                            </div>
                            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Banco Popular <span class="text-blue-600">Digital</span></h1>
                            <p class="text-xs text-slate-500 mt-1">Banca electrónica segura y avanzada (DOP)</p>
                        </div>

                        <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6">
                            <button onclick="setAuthMode('login')" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition ${authMode === 'login' ? 'bg-white text-popular shadow-sm' : 'text-slate-500 hover:text-slate-800'}">Iniciar Sesión</button>
                            <button onclick="setAuthMode('register')" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition ${authMode === 'register' ? 'bg-white text-popular shadow-sm' : 'text-slate-500 hover:text-slate-800'}">Crear Cuenta</button>
                        </div>

                        ${authMode === 'login' ? renderLoginForm() : renderRegisterForm()}
                    </div>
                    <div class="text-center mt-6 text-xs text-blue-200/80">
                        <p>© 2026 Banco Popular Dominicano, S.A. - Todos los derechos reservados.</p>
                    </div>
                </div>
            `;
        }

        function setAuthMode(mode) {
            authMode = mode;
            render();
        }

        function renderLoginForm() {
            return `
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Número de Cuenta o Usuario</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fas fa-user"></i></span>
                            <input type="text" id="login-account" required placeholder="Ej. 4501928374 o tu nombre" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">PIN de Acceso (4 dígitos)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fas fa-lock"></i></span>
                            <input type="password" id="login-pin" maxlength="4" required placeholder="••••" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition tracking-widest">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-popular hover:bg-blue-900 text-white font-bold rounded-xl shadow-lg shadow-blue-900/30 transition transform active:scale-98">
                        Ingresar a la Plataforma
                    </button>
                </form>
            `;
        }

        function renderRegisterForm() {
            return `
                <form onsubmit="handleRegister(event)" class="space-y-3.5">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre Completo</label>
                        <input type="text" id="reg-name" required placeholder="Juan Pérez" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre de Banco</label>
                            <input type="text" id="reg-bank" value="Banco Popular" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">No. de Cuenta Elegido</label>
                            <input type="text" id="reg-account" required placeholder="Ej. 78912345" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Teléfono</label>
                            <input type="tel" id="reg-phone" required placeholder="829-555-0192" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">PIN (4 dígitos)</label>
                            <input type="password" id="reg-pin" maxlength="4" required placeholder="••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 tracking-widest">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-popular hover:bg-blue-900 text-white font-bold rounded-xl shadow-lg shadow-blue-900/30 transition mt-2">
                        Registrarse y Activar Cuenta
                    </button>
                </form>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const acc = document.getElementById('login-account').value.trim();
            const pin = document.getElementById('login-pin').value.trim();

            if (!db.user || (db.user.accountNumber !== acc && db.user.name.toLowerCase() !== acc.toLowerCase()) || db.user.pin !== pin) {
                showModal('Acceso Denegado', 'Las credenciales ingresadas no coinciden con ningún registro guardado. Si es nuevo, por favor regístrese.');
                return;
            }

            // Start 13 seconds loading animation as requested
            runLoadingScreen(() => {
                db.isLoggedIn = true;
                saveDB();
                render();
            });
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const bankName = document.getElementById('reg-bank').value.trim();
            const accountNumber = document.getElementById('reg-account').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const pin = document.getElementById('reg-pin').value.trim();

            db.user = {
                name,
                bankName,
                accountNumber,
                phone,
                pin,
                balance: 0.00 // Saldo inicial en 0 as requested
            };

            // Add welcome transaction
            db.transactions = [{
                id: Date.now(),
                type: 'info',
                description: 'Apertura de Cuenta Digital ' + bankName,
                amount: 0.00,
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                category: 'Sistema'
            }];

            saveDB();

            // Run exact 13 seconds loading animation
            runLoadingScreen(() => {
                db.isLoggedIn = true;
                saveDB();
                render();
            });
        }

        function runLoadingScreen(onComplete) {
            const app = document.getElementById('app');
            let timeLeft = 13;

            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-blue-950 to-popular text-white">
                    <div class="text-center max-w-sm w-full bg-white/10 backdrop-blur-xl p-8 rounded-3xl border border-white/20 shadow-2xl">
                        <div class="relative w-32 h-32 mx-auto mb-6 flex items-center justify-center">
                            <!-- Rotating ring -->
                            <div class="absolute inset-0 border-4 border-blue-400/30 border-t-popular-gold rounded-full animate-spin"></div>
                            <div class="flex flex-col items-center">
                                <i class="fas fa-shield-alt text-3xl text-popular-gold mb-1"></i>
                                <span id="countdown-timer" class="text-3xl font-black">${timeLeft}s</span>
                            </div>
                        </div>
                        <h2 class="text-xl font-bold mb-2">Configurando tu Entorno</h2>
                        <p id="loading-status-text" class="text-xs text-blue-200 mb-6 leading-relaxed">Estableciendo conexión encriptada con servidores de ${db.user ? db.user.bankName : 'Banco Popular'}...</p>
                        <div class="w-full bg-blue-950/80 rounded-full h-2.5 overflow-hidden p-0.5 border border-white/10">
                            <div id="loading-progress-bar" class="bg-gradient-to-r from-blue-400 to-popular-gold h-full rounded-full transition-all duration-1000" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            `;

            const timerInterval = setInterval(() => {
                timeLeft--;
                const progress = ((13 - timeLeft) / 13) * 100;
                
                const timerEl = document.getElementById('countdown-timer');
                const barEl = document.getElementById('loading-progress-bar');
                const statusEl = document.getElementById('loading-status-text');

                if (timerEl) timerEl.innerText = timeLeft + 's';
                if (barEl) barEl.style.width = progress + '%';

                if (statusEl) {
                    if (timeLeft === 10) statusEl.innerText = 'Verificando datos biométricos y seguridad...';
                    if (timeLeft === 7) statusEl.innerText = 'Generando token digital y tarjetas principales...';
                    if (timeLeft === 3) statusEl.innerText = '¡Casi listo! Finalizando sincronización...';
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    onComplete();
                }
            }, 1000);
        }

        let activeTab = 'dashboard'; // 'dashboard', 'cards', 'loans', 'help', 'movements'

        function renderDashboard() {
            return `
                <div class="min-h-screen flex flex-col bg-slate-100">
                    <!-- Top Navigation Bar -->
                    <header class="bg-popular text-white shadow-md sticky top-0 z-40">
                        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center font-bold text-popular-gold">
                                    <i class="fas fa-university"></i>
                                </div>
                                <div>
                                    <h1 class="text-sm font-bold tracking-wide">${db.user.bankName}</h1>
                                    <p class="text-[10px] text-blue-200">Hola, <span class="font-semibold text-white">${db.user.name}</span></p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button onclick="openDepositModal()" class="px-3 py-1.5 bg-popular-gold text-slate-900 text-xs font-bold rounded-lg hover:bg-yellow-500 transition shadow flex items-center space-x-1">
                                    <i class="fas fa-plus-circle"></i><span>Recargar</span>
                                </button>
                                <button onclick="handleLogout()" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-blue-200 hover:text-white transition" title="Cerrar Sesión">
                                    <i class="fas fa-sign-out-alt text-sm"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    <!-- Main Scrollable Content Area -->
                    <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-24">
                        ${activeTab === 'dashboard' ? renderHomeTab() : ''}
                        ${activeTab === 'cards' ? renderCardsTab() : ''}
                        ${activeTab === 'loans' ? renderLoansTab() : ''}
                        ${activeTab === 'help' ? renderHelpTab() : ''}
                        ${activeTab === 'movements' ? renderMovementsTab() : ''}
                    </main>

                    <!-- Bottom Tab Bar -->
                    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-40">
                        <div class="max-w-4xl mx-auto flex justify-around py-2 px-1">
                            <button onclick="switchTab('dashboard')" class="flex flex-col items-center py-1 px-3 rounded-xl transition ${activeTab === 'dashboard' ? 'text-popular font-bold' : 'text-slate-400 hover:text-slate-600'}">
                                <i class="fas fa-home text-lg mb-1"></i>
                                <span class="text-[10px]">Inicio</span>
                            </button>
                            <button onclick="switchTab('cards')" class="flex flex-col items-center py-1 px-3 rounded-xl transition ${activeTab === 'cards' ? 'text-popular font-bold' : 'text-slate-400 hover:text-slate-600'}">
                                <i class="fas fa-credit-card text-lg mb-1"></i>
                                <span class="text-[10px]">Tarjetas</span>
                            </button>
                            <button onclick="switchTab('loans')" class="flex flex-col items-center py-1 px-3 rounded-xl transition ${activeTab =
